name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - uses: go-task/setup-task@v2
      - run: task check
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/build/reports/tests/"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs:build

  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - uses: go-task/setup-task@v2
      - name: Install nono 0.69.0
        env:
          NONO_INSTALL_DIR: ${{ runner.temp }}/nono/bin
          NONO_VERSION: 0.69.0
        run: |
          scripts/install-nono.sh
          echo "${NONO_INSTALL_DIR}" >> "${GITHUB_PATH}"
      - run: task integration
      - name: Upload integration reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: integration-reports-${{ matrix.os }}
          path: build/reports/tests/integrationTest/
