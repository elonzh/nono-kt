version: "3"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  check:
    desc: Run all tests and static checks
    cmds:
      - ./gradlew check ktlintCheck --no-daemon
      - ruby scripts/verify-workflows.rb

  lint:
    desc: Check Kotlin and Kotlin Gradle formatting
    cmds:
      - ./gradlew ktlintCheck --no-daemon

  format:
    desc: Format Kotlin and Kotlin Gradle files
    cmds:
      - ./gradlew ktlintFormat --no-daemon

  docs:
    desc: Check and build the documentation site
    cmds:
      - ./gradlew docsCheck --no-daemon
      - npm ci
      - npm run docs:build

  docs:dev:
    desc: Start the VitePress documentation server
    cmds:
      - npm run docs:dev

  publish:local:
    desc: Publish to an isolated Maven repository and compile a consumer
    cmds:
      - ./scripts/verify-local-publication.sh

  integration:
    desc: Run tests against an installed supported nono CLI
    env:
      NONO_INTEGRATION: "1"
    cmds:
      - ./gradlew integrationTest --no-daemon
